workflows:
  android-build:
    name: Android build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Build release bundle
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          gradle bundleRelease
    artifacts:
      - "**/build/outputs/**/*.aab"
