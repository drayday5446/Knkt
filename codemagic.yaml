workflows:
  android-build:
    name: Android build
    max_build_duration: 60
    instance_type: mac_mini_m2
    scripts:
      - name: Build release bundle
        script: |
          GRADLEW=$(find . -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found. Files in repo:"
            find . -maxdepth 3 -not -path './.git/*' | head -n 60
            exit 1
          fi
          cd "$(dirname "$GRADLEW")"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew bundleRelease
    artifacts:
      - "**/build/outputs/**/*.aab"
