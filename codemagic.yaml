workflows:
  android-build:
    name: Android build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Build release bundle
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          GRADLE_VERSION=8.13
          curl -sL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o gradle.zip
          unzip -q gradle.zip -d "$HOME/gradle-dist"
          "$HOME/gradle-dist/gradle-${GRADLE_VERSION}/bin/gradle" bundleRelease
    artifacts:
      - "**/build/outputs/**/*.aab"
